<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 管理控制台</title>
  <link rel="stylesheet" href="../style.css?v=5" />
</head>
<body>
  <!-- 无权限提示（非管理员进入管理端） -->
  <div id="guard-view" class="guard-view hidden">
    <div class="auth-card">
      <div class="auth-logo">🚫</div>
      <h1>无权限访问</h1>
      <p class="auth-sub">当前账号不是管理员，无法进入管理控制台</p>
      <p class="auth-footnote">
        请使用管理员账号登录，或前往 <a href="../user/index.html">用户端</a>
      </p>
      <div class="guard-actions">
        <button class="btn-primary" id="guard-relogin">切换账号</button>
        <a class="btn-small" href="../user/index.html">返回用户端</a>
      </div>
    </div>
  </div>

  <!-- 管理控制台（仅管理功能，无对话） -->
  <div id="app-view" class="app-view hidden">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">🛠 管理控制台</div>
      </div>

      <div class="sidebar-section-title">管理</div>
      <div class="sidebar-nav">
        <button class="nav-btn active" id="users-btn">👥 用户管理</button>
        <button class="nav-btn" id="docs-btn">📤 上传记录</button>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-meta">
            <div class="user-name" id="user-name">管理员</div>
            <div class="user-role" id="user-role">管理员</div>
          </div>
          <button class="logout-btn" id="logout-btn" title="退出登录">⏻</button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <!-- 用户管理 -->
      <div class="users-view" id="users-view">
        <header class="chat-header">
          <button class="menu-toggle" id="users-menu-toggle">☰</button>
          <div class="chat-title">用户管理</div>
          <button class="btn-small btn-accent header-right" id="create-user-btn">＋ 新建用户</button>
        </header>
        <div class="users-body">
          <div class="users-toolbar">
            <span class="users-count" id="users-count"></span>
            <button class="refresh-btn" id="refresh-users">刷新</button>
          </div>
          <div class="users-table-wrap">
            <table class="users-table">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>昵称</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 上传记录（全部用户，可删除） -->
      <div class="docs-view hidden" id="docs-view">
        <header class="chat-header">
          <button class="menu-toggle" id="docs-menu-toggle">☰</button>
          <div class="chat-title">上传记录</div>
        </header>
        <div class="docs-body">
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" hidden />
            <div class="upload-icon">⬆</div>
            <div class="upload-text">点击或拖拽文件到此处上传</div>
            <div class="upload-sub">支持 PDF 等文档，后台异步解析入库</div>
          </div>
          <div class="upload-progress hidden" id="upload-progress"></div>

          <div class="docs-list-header">
            <span id="docs-count">全部上传记录</span>
            <button class="refresh-btn" id="refresh-docs">刷新</button>
          </div>
          <div class="users-table-wrap">
            <table class="users-table">
              <thead>
                <tr>
                  <th>文件名</th>
                  <th>页数</th>
                  <th>状态</th>
                  <th>上传时间</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="docs-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">标题</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script src="../common.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
