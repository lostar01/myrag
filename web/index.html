<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 知识库助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录入口：登录后默认进入用户端；管理员可在用户端侧边栏切换到管理端 -->
  <div id="entry-view" class="auth-view">
    <div class="auth-card">
      <div class="auth-logo">📚</div>
      <h1>RAG 知识库助手</h1>
      <p class="auth-sub">基于你的文档，智能问答</p>

      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" type="button" data-tab="login">登录</button>
        <button class="auth-tab hidden" type="button" data-tab="register" id="register-tab">注册</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="用户名" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit" class="btn-primary" id="login-submit">登录</button>
        <div class="auth-error" id="login-error"></div>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-username" placeholder="用户名（至少3位）" autocomplete="username" required />
        <input type="text" id="reg-nickname" placeholder="昵称（可选）" />
        <input type="password" id="reg-password" placeholder="密码（至少6位）" autocomplete="new-password" required />
        <button type="submit" class="btn-primary">注册</button>
        <div class="auth-error" id="register-error"></div>
      </form>

      <p class="auth-footnote" id="auth-footnote">账号由管理员统一创建，如需开通请联系管理员</p>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="entry.js"></script>
</body>
</html>
