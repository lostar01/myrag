# 应用总开关：调试模式，true会打印更多日志
debug: true
# 日志级别：DEBUG / INFO / WARNING / ERROR
log_level: "INFO"

# 文档提取模块（docling解析PDF等文档）
docling_parser:
  # docling模型缓存目录，存放layout、ocr等模型工件
  docling_artifacts_dir: "D:/docling_models"
  # 解析输出根目录：md、json、提取图片都会放在这里
  output_dir: "D:/code/rag/output"

# markdown预处理模块
markdown_preprocessor:
  # 每个chunk的token数，超过这个数会拆分
  chunk_size: 700
  # 每个chunk的token数，超过这个数会拆分
  overlap: 120
  # 最小chunk的token数，小于这个数会合并
  min_chunk_token: 10
  # 使用的embedding模型
  embedding_model_name: "D:/models/bge-m3"
  # 是否只处理本地文件，true则不处理url
  local_files_only: True
  # 是否打印日志
  enable_log: False
  # 是否跳过只有标题的section
  skip_title_only_section: False

# embedding模块
embedding:
  # embedding模型名称
  model_name: "D:/models/bge-m3"
  # 是否只处理本地文件，true则不处理url
  local_files_only: True
   # 使用cuda还是cpu
  device: "cuda"
  embed_url: "http://172.27.18.108:8080/embed"
  embed_health_url: "http://172.27.18.108:8080/health"
  

# rerank模块
rerank:
  # rerank模型名称
  model_name: "D:/models/bge-reranker-v2-m3"
  # 是否只处理本地文件，true则不处理url
  local_files_only: True
  rerank_url: "http://172.27.18.108:8081/rerank"
  rerank_health_url: "http://172.27.18.108:8081/health"

# llm 模块
